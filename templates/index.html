<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI News Summarizer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="icon">📰</div>

            <h1>AI News Summarizer</h1>

            <p>
                Enter a news article and generate a concise summary using AI.
            </p>
        </div>


        <!-- Input Section -->
        <div class="input-section">

            <div class="section-title">

                <label for="newsInput">
                    Enter Your News Article
                </label>

                <span id="charCount">
                    0 / 10,000 characters
                </span>

            </div>


            <textarea
                id="newsInput"
                maxlength="10000"
                placeholder="Paste or type your news article here..."
            ></textarea>


            <!-- Character Warning -->
            <div id="charWarning"></div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                    id="summarizeBtn"
                    onclick="summarizeNews()"
                >
                    ✨ Summarize
                </button>


                <button
                    id="clearBtn"
                    onclick="clearText()"
                >
                    🗑 Clear
                </button>

            </div>

        </div>


        <!-- Loading -->
        <div id="loading">

            <div class="loader"></div>

            <span>
                AI is generating your summary...
            </span>

        </div>


        <!-- Output Section -->
        <div class="output-section">

            <div class="output-title">

                <h2>📌 AI Summary</h2>

            </div>


            <div id="summary">

                Your summary will appear here.

            </div>

        </div>


        <!-- Footer -->
        <div class="footer">

            <p>
                Powered by Python Flask &amp; AI
            </p>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
